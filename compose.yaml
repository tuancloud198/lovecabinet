services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lovecabinet}
      POSTGRES_USER: ${POSTGRES_USER:-lovecabinet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    build: ./infra/minio
    image: lovecabinet-minio:local
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-lovecabinet}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-minio-password}
    volumes: [minio_data:/data]
    ports: ['127.0.0.1:9001:9001']
  minio-init:
    build: ./backend
    env_file: .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
    command: python manage.py init_storage
    depends_on: [minio]
  migrate:
    build: ./backend
    env_file: .env
    environment: &backend-env
      POSTGRES_HOST: db
      MINIO_ENDPOINT: http://minio:9000
    command: python manage.py migrate --noinput
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    env_file: .env
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    ports: ['${APP_PORT:-8080}:80']
    depends_on: [backend]
volumes:
  postgres_data:
  minio_data:
